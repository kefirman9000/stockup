# Publishes a release (with stockup.py attached) whenever the VERSION line in
# stockup.py changes on main. StockUp's Update button installs the newest one.
name: Release
on:
  push:
    branches: [main]
    paths: ["stockup.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: v
        run: |
          python3 -m py_compile stockup.py
          echo "tag=v$(grep -m1 '^VERSION = ' stockup.py | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Publish the release if it's new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released"; exit 0
          fi
          gh release create "$TAG" stockup.py --target "$GITHUB_SHA" \
            --title "StockUp ${TAG#v}" --notes-file .github/release-notes.md
