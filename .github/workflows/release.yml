# Publishes a release (with stockup.py attached) whenever a version tag is pushed,
# e.g.  git tag v1.2.0 && git push origin v1.2.0
# StockUp's Update button installs the newest of these releases.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the version number matches the tag
        run: |
          v=$(grep -m1 '^VERSION = ' stockup.py | cut -d'"' -f2)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "stockup.py says $v but the tag is ${GITHUB_REF_NAME}"; exit 1; }
          python3 -m py_compile stockup.py
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" stockup.py \
            --title "StockUp ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
